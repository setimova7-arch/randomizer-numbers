<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Генератор случайных чисел</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
        text-align: center;
        padding: 30px 15px;
    }

    .box {
        max-width: 400px;
        margin: auto;
        background: #1f2937;
        padding: 25px;
        border-radius: 20px;
    }

    h1 {
        margin-bottom: 25px;
    }

    input {
        width: 80%;
        padding: 12px;
        margin: 8px;
        border-radius: 10px;
        border: none;
        font-size: 18px;
        text-align: center;
    }

    button {
        margin-top: 15px;
        padding: 14px 25px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
    }

    #result {
        font-size: 55px;
        font-weight: bold;
        margin: 25px 0;
    }

    #history {
        margin-top: 20px;
        color: #bbb;
    }
</style>
</head>

<body>

<div class="box">

    <h1>🎲 Генератор чисел</h1>

    <input id="min" type="number" value="1" placeholder="Минимум">

    <input id="max" type="number" value="100" placeholder="Максимум">

    <div id="result">?</div>

    <button onclick="generate()">🎲 Получить число</button>

    <div id="history">
        История: пока пусто
    </div>

</div>

<script>

let history = [];

function generate() {

    let min = Number(document.getElementById("min").value);
    let max = Number(document.getElementById("max").value);

    if (min >= max) {
        document.getElementById("result").textContent = "❌";
        return;
    }

    let number = Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

    document.getElementById("result").textContent = number;

    history.unshift(number);

    if (history.length > 10) {
        history.pop();
    }

    document.getElementById("history").textContent =
        "История: " + history.join(", ");
}

</script>

</body>
</html>
